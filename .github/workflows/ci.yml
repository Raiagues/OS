name: Kernel CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc python3
      - name: Check tools
        run: make PLATFORM=virt check
      - name: Compile and run QEMU tests
        run: make test
      - name: Compile each independent example with the current compiler
        run: |
          make PLATFORM=cep
          for project in examples/*/; do
            make -C "$project" PLATFORM=cep
          done
      - name: Save binaries and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-kernel-and-test-logs
          path: |
            build/**/*.elf
            build/**/*.map
            build/**/*.log
            examples/*/build/**/*.elf
            examples/*/build/**/*.map
            tests/kernel/build/**/*.elf
            tests/kernel/build/**/*.log
          if-no-files-found: ignore

  cep-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run CEP demonstrations and capture the framebuffer
        run: |
          docker run --rm --platform linux/amd64 --ulimit core=0 \
            --tmpfs /tmp:rw,size=64m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace --entrypoint sh \
            sebastienviardot/pcsefriscv@sha256:701a53695beefb420e003b39c18c04f3c43de67cddbcf8ab534fa8378855e250 \
            -ec '
              export CROSS_COMPILE=/matieres/4MMPCSEA/xinul/bin/riscv64-unknown-elf-
              export QEMU=/matieres/4MMPCSEA/xinul/bin/qemu-system-riscv64
              export RISCV_ARCH=rv64ima
              python3 scripts/capture_evidence.py
            '
      - name: Save actual CEP images, UART logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cep-framebuffer-evidence
          path: build/evidence/
          if-no-files-found: ignore
